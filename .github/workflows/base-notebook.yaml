name: base-notebook builder

#on:
#  push:
#    branches: [ "main" ]
#  pull_request:
#    branches: [ "main" ]

on: workflow_dispatch

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: 'true'
        submodules: 'true'
    - name: Docker login
      env: 
        DOCKER_USER: ${{secrets.DOCKER_USERNAME}}
        DOCKER_TOKEN: ${{secrets.DOCKER_TOKEN}}
        #DOCKER_USER: ${{secrets.DOCKER_USER_TUSHAR}}
        #DOCKER_TOKEN: ${{secrets.DOCKER_TOKEN_TUSHAR}}
      run: |
        #echo ${{secrets.DOCKER_TOKEN_TUSHAR}} | docker login -u  ${{secrets.DOCKER_USER_TUSHAR}} --password-stdin
        echo ${{secrets.DOCKER_TOKEN}} | docker login -u  ${{secrets.DOCKER_USERNAME}} --password-stdin
    - name: Current working directory
      run: echo current working directory $(pwd)
    - name: Build the Docker image
      run: cd images/base-notebook && docker build . --file Dockerfile --tag ${{secrets.DOCKER_USERNAME}}/base-notebook:ub22.04-py3.11
      #run: cd .github/workflows/pyspark-notebook && docker build . --file Dockerfile.py3.11-spark3.5.1-jl4 --tag ${{secrets.DOCKER_USER_TUSHAR}}/jupyter-pyspark-notebook:spark3.5.1-py3.11-u22.04-jl4-v14
    - name: Docker image push
      run:  docker push ${{secrets.DOCKER_USERNAME}}/base-noteboom:ub22.04-py3.11
      #run:  docker push ${{secrets.DOCKER_USER_TUSHAR}}/jupyter-pyspark-notebook:park3.5.1-py3.11-u22.04-jl4-v14
      
